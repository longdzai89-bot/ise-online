<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ISE Online</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: #000;
  overflow: hidden;
  width: 100%;
  height: 100%;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  image-rendering: pixelated;
}
#rotate-msg {
  display: none;
  position: fixed;
  inset: 0;
  background: #000;
  color: #fff;
  font-size: 22px;
  font-family: monospace;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 9999;
  text-align: center;
}
#rotate-msg span { font-size: 52px; }
@media (orientation: portrait) {
  #rotate-msg { display: flex; }
  canvas { display: none; }
}
</style>
</head>
<body>
<div id="rotate-msg">
  <span>&#x21BB;</span>
  Xoay ngang điện thoại để chơi
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="src/SplashScene.js"></script>
<script src="src/MenuScene.js"></script>
<script src="src/GameScene.js"></script>
<script src="src/HUDScene.js"></script>
<script src="src/GameOverScene.js"></script>
<script src="src/LevelCompleteScene.js"></script>
<script src="src/main.js"></script>
<script>
if (screen.orientation && screen.orientation.lock) {
  screen.orientation.lock('landscape').catch(() => {});
}
</script>
</body>
</html>
